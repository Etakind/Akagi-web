name: Release
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the manually reviewed maintenance build
        type: boolean
        default: false
      tag:
        description: Existing release tag (required only for publishing)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build-packages.yml
    with:
      ref: ${{ github.sha }}
      repository: ${{ github.repository }}
  assets:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: akagi-*
          path: release-assets
          merge-multiple: true
      - name: Optional signature with the existing matching identity
        env:
          SIGNING_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        shell: bash
        run: |
          if [[ -z "$SIGNING_KEY" ]]; then
            echo 'No signing key configured; artifacts remain unsigned.'
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y minisign
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key_file"
          probe_file=$(mktemp)
          trap 'rm -f "$key_file" "$probe_file" "$probe_file.minisig"' EXIT
          printf '%s\n' 'Akagi maintenance signing identity check' > "$probe_file"
          minisign -S -s "$key_file" -m "$probe_file"
          minisign -V -p minisign.pub -m "$probe_file"
          for asset in release-assets/*; do
            minisign -S -s "$key_file" -m "$asset" -t "$(basename "$asset")"
            minisign -V -p minisign.pub -m "$asset"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-release-assets
          path: release-assets/*
      - name: Publish only the explicitly selected existing tag
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          [[ -n "$RELEASE_TAG" ]] || { echo 'An existing tag is required'; exit 1; }
          git check-ref-format "refs/tags/$RELEASE_TAG"
          tag_sha=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          [[ "$tag_sha" == "$GITHUB_SHA" ]] || { echo 'Tag must point to this build commit'; exit 1; }
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "Akagi maintenance $RELEASE_TAG" --generate-notes
