name: Release
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the manually reviewed maintenance build
        type: boolean
        default: false
      tag:
        description: Existing release tag (required only for publishing)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build:
    uses: ./.github/workflows/build-packages.yml
    with:
      ref: ${{ github.sha }}
      repository: ${{ github.repository }}
  assets:
    needs: [build, checks]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: akagi-*
          path: release-assets
          merge-multiple: true
      - name: Optional signature with the existing matching identity
        env:
          SIGNING_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        shell: bash
        run: |
          if [[ -z "$SIGNING_KEY" ]]; then
            echo 'No signing key configured; artifacts remain unsigned.'
            exit 0
          fi
          [[ -f minisign.pub ]] || { echo 'Publisher public key minisign.pub is required for signing'; exit 1; }
          sudo apt-get update && sudo apt-get install -y minisign
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key_file"
          probe_file=$(mktemp)
          trap 'rm -f "$key_file" "$probe_file" "$probe_file.minisig"' EXIT
          printf '%s\n' 'Akagi maintenance signing identity check' > "$probe_file"
          minisign -S -s "$key_file" -m "$probe_file"
          minisign -V -p minisign.pub -m "$probe_file"
          for asset in release-assets/*; do
            minisign -S -s "$key_file" -m "$asset" -t "$(basename "$asset")"
            minisign -V -p minisign.pub -m "$asset"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-release-assets
          path: release-assets/*
      - name: Publish only the explicitly selected existing tag
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          [[ -n "$RELEASE_TAG" ]] || { echo 'An existing tag is required'; exit 1; }
          git check-ref-format "refs/tags/$RELEASE_TAG"
          tag_sha=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          [[ "$tag_sha" == "$GITHUB_SHA" ]] || { echo 'Tag must point to this build commit'; exit 1; }
          notes="docs/releases/${RELEASE_TAG}.md"
          [[ -f "$notes" ]] || { echo 'Reviewed release notes are required'; exit 1; }
          python3 scripts/verify_release.py release-assets
          version=$(python3 -c 'import re; print(re.search(r"^version = \"([^\"]+)\"", open("Cargo.toml").read(), re.M).group(1))')
          [[ "$RELEASE_TAG" == "v$version" ]] || { echo 'Release tag and application version must match'; exit 1; }
          gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag --title "Akagi Web $RELEASE_TAG" --notes-file "$notes"
          # GitHub's tag endpoint does not reliably resolve an unpublished draft.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > "$RUNNER_TEMP/release-drafts.json"
          release_id=$(python3 -c 'import json, os, sys; matches = [r for page in json.load(open(sys.argv[1])) for r in page if r["tag_name"] == os.environ["RELEASE_TAG"] and r["draft"]]; assert len(matches) == 1, "Expected one matching draft"; print(matches[0]["id"])' "$RUNNER_TEMP/release-drafts.json")
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/uploaded-release.json"
          python3 scripts/verify_release.py release-assets --uploaded-metadata "$RUNNER_TEMP/uploaded-release.json" --tag "$RELEASE_TAG"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false -f make_latest=true --silent
