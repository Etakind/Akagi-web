name: Auto Liqi

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-liqi:
    # Personal fork receives protocol changes through upstream/v3 merges.
    if: github.repository == 'shinkuan/Akagi'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v3
        uses: actions/checkout@v4
        with:
          ref: v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install extractor dependencies
        run: python -m pip install --upgrade requests "UnityPy==1.25.2" protobuf

      - name: Extract liqi from the Unity client
        id: extract
        run: python scripts/extract_liqi.py

      - name: Open PR
        if: steps.extract.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: v3
          branch: auto/liqi-${{ steps.extract.outputs.product_version }}
          delete-branch: true
          commit-message: |
            chore(majsoul): update liqi.proto/liqi.json to ${{ steps.extract.outputs.product_version }}

            bundle_hash: ${{ steps.extract.outputs.bundle_hash }}
          title: "chore(majsoul): update liqi to ${{ steps.extract.outputs.product_version }}"
          body: |
            Automated update of Mahjong Soul protocol definitions.

            - Client productVersion: `${{ steps.extract.outputs.product_version }}`
            - Bundle hash: `${{ steps.extract.outputs.bundle_hash }}`

            Reconstructed directly from the Mahjong Soul Unity client asset
            bundles (protobuf descriptors in `Protol/*_pb.lua`, service table in
            `docs/proto_config.bytes`) by `scripts/extract_liqi.py`. No external
            proto release is involved.

            Review the diff before merging — `liqi.proto` fuels `build.rs`
            (prost-build) and the runtime descriptor pool, and `liqi.json` is the
            flat rpc-map used by `src/bridge/majsoul/parser.rs`.
          labels: |
            automation
            majsoul
          add-paths: |
            src/bridge/majsoul/liqi.json
            src/bridge/majsoul/proto/liqi.proto
