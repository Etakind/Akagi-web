name: PR Build Artifacts

on:
  issue_comment:
    types: [created]

# A new request for the same PR replaces an older in-flight build.
concurrency:
  group: pr-build-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  authorize:
    name: Authorize build request
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/build-artifacts'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
      head_repository: ${{ steps.authorize.outputs.head_repository }}
      head_sha: ${{ steps.authorize.outputs.head_sha }}
    steps:
      - name: Require repository admin permission
        id: authorize
        uses: actions/github-script@v9
        with:
          script: |
            core.setOutput('authorized', 'false');

            const { owner, repo } = context.repo;
            const username = context.payload.comment.user.login;
            const { data: access } =
              await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username,
              });

            if (access.permission !== 'admin') {
              core.notice(`Ignoring build request from non-admin user ${username}`);
              return;
            }

            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: context.issue.number,
            });

            if (pull.state !== 'open' || !pull.head.repo) {
              core.notice('Ignoring build request for a closed PR or deleted fork');
              return;
            }

            core.setOutput('authorized', 'true');
            core.setOutput('head_repository', pull.head.repo.full_name);
            core.setOutput('head_sha', pull.head.sha);

  build:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build-packages.yml
    with:
      ref: ${{ needs.authorize.outputs.head_sha }}
      repository: ${{ needs.authorize.outputs.head_repository }}
