name: Build maintenance packages
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      repository:
        type: string
        required: true
permissions:
  contents: read
jobs:
  targets:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: targets
        run: echo "matrix=$(python3 scripts/package.py --matrix)" >> "$GITHUB_OUTPUT"
  build:
    needs: targets
    env:
      RUSTFLAGS: '-D warnings'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package tooling regression on the target OS
        run: python3 scripts/test_package.py
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - name: Prefer Rust toolchain on macOS
        if: runner.os == 'macOS'
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build desktop and packages
        shell: bash
        run: |
          if [[ '${{ matrix.os }}' == linux ]]; then
            npm exec --prefix frontend -- tauri build --target '${{ matrix.target }}' --bundles deb,rpm
          else
            npm exec --prefix frontend -- tauri build --target '${{ matrix.target }}' --no-bundle
          fi
      - name: Package reviewed files and hashes
        run: python3 scripts/package.py --target ${{ matrix.target }}
      - name: Verify packaged executable and native package architecture
        run: python3 scripts/smoke_package.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: akagi-${{ matrix.target }}
          path: dist/*.*
          if-no-files-found: error
          retention-days: 14
