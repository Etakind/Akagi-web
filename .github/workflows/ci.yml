name: CI

# Local web maintenance: shared five-target build matrix.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        run: echo "matrix=$(python3 scripts/package.py --matrix)" >> "$GITHUB_OUTPUT"
  rust:
    needs: targets
    name: Rust (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # 首次 Windows 编译较慢；测试失败也保存已构建的依赖。
          cache-on-failure: true

      # build.rs runs prost-build on liqi.proto and needs protoc on PATH.
      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: test all targets
        run: cargo test --locked --all-targets

      - name: Native bot regression
        run: cargo test --locked --manifest-path native_bot/Cargo.toml

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/test_setup_fork.py
      - run: python3 scripts/test_web_only.py
      - run: python3 scripts/test_package.py

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `npm run build` is `tsc -b && vite build` — type-checks too.
      - name: Build
        run: npm run build
